[package]
name = "demiurge-wl"
version.workspace = true
edition.workspace = true

[lib]
name = "demiurge_wl"
path = "src/lib.rs"

# The compositor in the test window.
[[bin]]
name = "demiurge-wl"
path = "src/main.rs"

# The same compositor on the real screen, run from a VT. greetd's
# start_session command points here once Wayland goes daily-driver.
[[bin]]
name = "demiurge-wl-tty"
path = "src/bin/demiurge-wl-tty.rs"

[dependencies]
demiurge-core = { path = "../../core/demiurge" }
# The window-policy API's types and its client half. Its x11rb is the one
# smithay's XWayland support already builds.
cherrypie-core = { path = "../../core/cherrypie" }
# The backends: Plumbing that cannot see the compositor.
demiurge-wl-screen = { path = "screen" }
demiurge-wl-window = { path = "window" }
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    # linux-drm-syncobj-v1, explicit sync, imports timelines on a DRM device.
    "backend_drm",
    # Pulls in smithay's XWayland helper + xwayland-shell protocol.
    # Required so x11 clients can connect to the session via the
    # Xwayland binary spawned on demand by demiurge-wl.
    "xwayland",
] }
# Match smithay's transitive pins so the workspace resolves to a single
# version of each.
wayland-server = "0.31"
# `staging` for color-management-v1, which smithay does not implement.
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
# wlr-gamma-control-v1, the gamma ramps ABRAXAS sets; smithay builds the
# crate for its own wlr protocols.
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
calloop = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Bar rendering. Same versions x11/Cargo.toml uses so the workspace
# resolves to a single cairo / pango / pangocairo build.
cairo-rs = { version = "0.20", features = ["png"] }
pangocairo = "0.20"
pango = "0.20"
libc = "0.2"
# The cursor theme's images, for the cursor the compositor draws.
xcursor = "0.3"

[dev-dependencies]
# Test harness drives demiurge-wl as a Wayland client. wayland-client
# is the client-side counterpart to wayland-server (same crate family).
# wayland-protocols' `client` feature exposes xdg-shell on the client
# side -- test code creates xdg_toplevel surfaces against demiurge-wl.
# `staging` opens up ext-session-lock-v1 for the lock-cycle test.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# input-method-v2's client half, for the text-input test's input method.
wayland-protocols-misc = { version = "0.3", features = ["client"] }
tempfile = "3"
# The policy test's scripted cherrypie reads and answers the API's lines.
serde_json = "1"
