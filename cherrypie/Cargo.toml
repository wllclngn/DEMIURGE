[package]
name = "cherrypie"
version.workspace = true
edition.workspace = true
description = "Window matching daemon for Linux"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
libc = "0.2"

[dependencies.x11rb]
version = "0.13"
features = ["randr"]
optional = true

[features]
default = ["x11"]
x11 = ["x11rb"]

[dev-dependencies]
tempfile = "3"
toml = "0.8"
