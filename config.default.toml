[general]
tags = ["X", "Y", "Z"]
default_layout = "floating"

# [appearance]: the single source of truth for the desktop accent +
# (projected) GTK theme / icon theme. The accent is read NATIVELY by
# every DEMIURGE surface -- bar focused tag, GORDIAN KNOT lock / login,
# MEDUSA selection -- so changing this one value moves the whole desktop
# together. gtk_theme / icon_theme are projected into ~/.gtkrc-2.0 +
# gtk-{3,4}.0/settings.ini by `demiurge --setup` for external GTK apps;
# leave empty to not touch them.
[appearance]
accent = "#4A4881"
gtk_theme = ""
icon_theme = ""

[bar]
height = 40
font = "Noto Sans 9"
bg = "#121212"
fg = "#888888"
clock_format = "%a %b %d %Y   %I:%M:%S %p %Z"
# tag_focused_bg left unset -> inherits [appearance].accent. Set it to
# give the focused-tag highlight a colour different from the accent.
tag_focused_fg = "#ffffff"
tag_occupied_fg = "#888888"
tag_empty_fg = "#555555"

# lxappearance replacement: cursor theme + default font. `demiurge --setup`
# writes the equivalent lxappearance files (GTK settings, icons/default)
# from these values. XCURSOR_THEME and XCURSOR_SIZE are exported at WM init.
#
# auto_hide: when true, the cursor hides after auto_hide_seconds of
# pointer stillness and reappears the moment the user moves the mouse.
# Force-shown during Super+drag. Set to true for a keyboard-forward
# session (cursor invisible while you type).
[cursor]
theme = "default"
size = 24
auto_hide = false
auto_hide_seconds = 5

[font]
default = "Noto Sans 9"

# Keyboard auto-repeat: DEMIURGE owns this surface (replaces
# `xset r rate ...` from startup.commands). Both fields default to
# 0 = "leave server default in place". Set both to non-zero to take
# over; values are re-applied on every MappingNotify so USB hot-plug
# and layout switches don't silently revert them.
#
# layout / variant / options: XKB layout selection. Empty = leave
# server default. options is a free-form pass-through (caps:escape,
# ctrl:nocaps, compose:menu, etc.).
[input.keyboard]
repeat_delay = 0
repeat_rate = 0
layout = ""
variant = ""
options = []

# Idle / power-save / lock thresholds. All values in seconds.
# 0 = "leave server default in place". GORDIAN KNOT's idle daemon
# reads lock_seconds from here.
[input.idle]
lock_seconds = 0
screensaver_seconds = 0
dpms_standby_seconds = 0
dpms_suspend_seconds = 0
dpms_off_seconds = 0

# X11 audible bell. All fields are optional (None = leave default).
# Most keyboard-forward setups want enabled = false. Uncomment to take
# over.
# [input.bell]
# enabled = false

# GORDIAN KNOT. Colors and font fall back to [appearance]; the two
# session_* keys are read only by `gordian_knot --login` (the greetd
# greeter) and decide what greetd execs after a successful auth. The
# defaults below are the X11 daily-driver; uncomment and swap for the
# Wayland session.
#
# [gordian_knot]
# session_cmd = ["startx", "/usr/local/bin/demiurge"]
# session_env = ["XDG_SESSION_TYPE=x11", "OZONE_PLATFORM=x11"]
#
#   Wayland instead:
# session_cmd = ["/usr/local/bin/demiurge-wl-tty"]
# session_env = ["XDG_SESSION_TYPE=wayland"]

# Per-output display config (mode / DSR / DPI). Match by connector
# name (`xrandr` to discover) or EDID model substring. Uncomment and
# fill in for your hardware. Replaces xrandr -s / --dpi from
# startup.commands.
#
# [[display]]
# match = "HDMI-0"
# mode = "2560x1440"
# dpi = 138
# dsr_multiplier = 1.0   # 2.0 = render at 4x pixels, downscale (DSR)

[startup]
commands = [
    "xrdb -merge ~/.Xresources",
    "cherrypie",
]

[[startup.spawn]]
cmd = "kitty"
tag = "X"

[[startup.spawn]]
cmd = "kitty --class montauk-term -e montauk"
tag = "Z"
class = "montauk-term"

# Terminal
[[keybind]]
mods = ["Super"]
key = "Return"
action = "spawn"
args = "kitty"

# Close window
[[keybind]]
mods = ["Alt"]
key = "F4"
action = "close_window"

# Quit WM
[[keybind]]
mods = ["Alt", "Shift"]
key = "F4"
action = "quit"

# Lock screen (DEMIURGE ships GORDIAN KNOT as the locker)
[[keybind]]
mods = ["Super"]
key = "Escape"
action = "lock"

# Tag navigation
[[keybind]]
mods = ["Super"]
key = "Left"
action = "view_prev_tag"

[[keybind]]
mods = ["Super"]
key = "Right"
action = "view_next_tag"

# View tags 1-3
[[keybind]]
mods = ["Super"]
key = "1"
action = "view_tag"
args = "1"

[[keybind]]
mods = ["Super"]
key = "2"
action = "view_tag"
args = "2"

[[keybind]]
mods = ["Super"]
key = "3"
action = "view_tag"
args = "3"

# Move window to tag
[[keybind]]
mods = ["Super", "Shift"]
key = "1"
action = "move_to_tag"
args = "1"

[[keybind]]
mods = ["Super", "Shift"]
key = "2"
action = "move_to_tag"
args = "2"

[[keybind]]
mods = ["Super", "Shift"]
key = "3"
action = "move_to_tag"
args = "3"

# Alt+Tab / Alt+` cycle windows ON THE CURRENT TAG only.
[[keybind]]
mods = ["Alt"]
key = "Tab"
action = "mru_next"

[[keybind]]
mods = ["Alt"]
key = "grave"
action = "mru_prev"

# Alt+Escape (Ducky One 2 Mini: no grave key)
[[keybind]]
mods = ["Alt"]
key = "Escape"
action = "mru_prev"

# Super+Tab / Super+Shift+Tab cycle ACROSS ALL TAGS (global MRU).
[[keybind]]
mods = ["Super"]
key = "Tab"
action = "mru_next_global"

[[keybind]]
mods = ["Super", "Shift"]
key = "Tab"
action = "mru_prev_global"

# Toggle always-on-top
[[keybind]]
mods = ["Super"]
key = "t"
action = "toggle_above"

# Toggle fullscreen
[[keybind]]
mods = ["Super"]
key = "f"
action = "toggle_fullscreen"

# Toggle layout
[[keybind]]
mods = ["Super"]
key = "space"
action = "toggle_layout"

# Run prompt
[[keybind]]
mods = ["Super"]
key = "r"
action = "run_prompt"

# Screenshot (MEDUSA -- DEMIURGE's own capture utility)
[[keybind]]
key = "F12"
action = "spawn"
args = "medusa gui -p $HOME"

[[keybind]]
mods = ["Shift"]
key = "F12"
action = "spawn"
args = "medusa full -p $HOME"

# Screenshot (Print Screen)
[[keybind]]
key = "Print"
action = "spawn"
args = "medusa gui -p $HOME"

# Volume (PipeWire/WirePlumber via wpctl; fires bar notification)
[[keybind]]
mods = ["Super"]
key = "Up"
action = "volume_up"

[[keybind]]
mods = ["Super"]
key = "Down"
action = "volume_down"

[[keybind]]
mods = ["Super"]
key = "m"
action = "volume_mute"

[[keybind]]
key = "XF86AudioMute"
action = "volume_mute"

[[keybind]]
key = "XF86AudioRaiseVolume"
action = "volume_up"

[[keybind]]
key = "XF86AudioLowerVolume"
action = "volume_down"

[[keybind]]
key = "XF86AudioMicMute"
action = "volume_mic_mute"

# Brightness (xbacklight; fires bar notification)
[[keybind]]
key = "XF86MonBrightnessUp"
action = "brightness_up"

[[keybind]]
key = "XF86MonBrightnessDown"
action = "brightness_down"

# Media (playerctl; fires bar notification)
[[keybind]]
key = "XF86AudioPlay"
action = "media_play_pause"

[[keybind]]
key = "XF86AudioNext"
action = "media_next"

[[keybind]]
key = "XF86AudioPrev"
action = "media_prev"
