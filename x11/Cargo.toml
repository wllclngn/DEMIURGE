[package]
name = "demiurge-x11"
version.workspace = true
edition.workspace = true

[lib]
name = "demiurge_x11"
path = "src/lib.rs"

[[bin]]
name = "demiurge"
path = "src/main.rs"

[[bin]]
name = "gordian_knot"
path = "src/bin/gordian_knot.rs"

[dependencies]
demiurge-core = { path = "../core" }
x11rb = { version = "0.13", features = ["randr", "render", "xkb", "screensaver", "xfixes", "dpms"] }
cairo-rs = { version = "0.20", features = ["png"] }
pangocairo = "0.20"
pango = "0.20"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
libc = "0.2"
# D-Bus client for gordian_knot's inhibit-watcher (logind ListInhibitors).
# zbus 4 with default async-io runtime (smol-based, tiny); we use its
# blocking re-exports since gordian_knot's D-Bus calls are infrequent.
zbus = "4"

[dev-dependencies]
tempfile = "3"
